[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-map"
version = "1.0.0"
description = "CODE-Map: Causal Operation & Dependency Evaluation Map for AI Agents and Software Engineering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "tree-sitter>=0.21.0",
]

[project.scripts]
codemap = "code_map.cli:main"

[tool.setuptools.packages.find]
include = ["code_map*"]
