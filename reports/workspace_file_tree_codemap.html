<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>CODE-Map 互動式全景語意因果地圖 (workspace-file-tree)</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --card-bg: #252538;
      --tree-bg: #181825;
      --border: #313244;
      --text: #cdd6f4;
      --text-dim: #a6adc8;
      --primary: #89b4fa;
      --accent: #f5c2e7;
      --success: #a6e3a1;
      --warning: #f9e2af;
      --danger: #f38ba8;
      --code-bg: #11111b;
      --drawer-bg: #1e1e2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      padding: 20px;
      line-height: 1.5;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 20px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-pass {
      background: rgba(166, 227, 161, 0.15);
      color: var(--success);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--success);
    }
    .stats-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 18px;
      flex: 1;
    }
    .stat-val {
      font-size: 22px;
      font-weight: bold;
      color: var(--primary);
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-dim);
    }
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--primary);
    }
    .layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .tree-col {
      flex: 1;
      background: var(--tree-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      font-family: "JetBrains Mono", Consolas, "Fira Code", monospace;
      font-size: 13px;
      overflow-x: auto;
      max-height: 800px;
      overflow-y: auto;
    }
    .code-col {
      width: 480px;
      background: var(--drawer-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      position: sticky;
      top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 800px;
    }
    .node-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }
    .node-row:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .node-row.active {
      background: rgba(137, 180, 250, 0.15);
      border-left: 3px solid var(--primary);
    }
    .tag-ctrl {
      color: #89dceb;
      font-weight: 700;
    }
    .tag-btn {
      color: #89b4fa;
      font-weight: 700;
      background: rgba(137, 180, 250, 0.12);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .tag-event {
      color: #f9e2af;
      font-weight: 600;
    }
    .tag-func {
      color: #a6e3a1;
      font-weight: 500;
    }
    .tag-await {
      color: #fab387;
      font-size: 11px;
      font-weight: bold;
    }
    .tag-type {
      font-size: 11px;
      color: var(--text-dim);
      background: var(--card-bg);
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .btn-inspect {
      margin-left: auto;
      background: rgba(137, 180, 250, 0.15);
      color: var(--primary);
      border: 1px solid rgba(137, 180, 250, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-inspect:hover {
      background: var(--primary);
      color: #11111b;
    }
    .sub-tree {
      margin-left: 20px;
      border-left: 1px dashed var(--border);
      padding-left: 10px;
    }
    .arrow {
      color: var(--text-dim);
      font-size: 11px;
      display: inline-block;
      width: 14px;
      transition: transform 0.15s;
    }
    .collapsed > .sub-tree { display: none; }
    .collapsed > .node-row .arrow { transform: rotate(-90deg); }
    
    /* Code Viewer */
    .code-title {
      font-size: 15px;
      font-weight: bold;
      color: var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .code-meta {
      font-size: 12px;
      color: var(--text-dim);
      background: var(--card-bg);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .code-box {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 12px;
      color: #cdd6f4;
      overflow-y: auto;
      max-height: 480px;
      white-space: pre;
    }
    .empty-state {
      color: var(--text-dim);
      text-align: center;
      padding: 60px 20px;
      font-size: 13px;
    }
    .copy-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .copy-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🌲 CODE-Map 全景語意因果地圖 <span>workspace-file-tree (sidecars/panel/app.js)</span></h1>
    <div class="badge-pass">🟢 READY_TO_SHIP</div>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-val">27</div>
      <div class="stat-label">UI 錨點控制項 (Anchors)</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">34</div>
      <div class="stat-label">已截取原始碼函式 (NetworkX Props)</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">0</div>
      <div class="stat-label">閉包作用域阻隔 (Scope Errors)</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">0</div>
      <div class="stat-label">主執行緒阻塞 (UI Blocking)</div>
    </div>
  </div>

  <div class="filter-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 即時搜尋控制項、按鈕或函式 (例如: delete, refresh, toast, preview)..." oninput="filterTree()">
  </div>

  <div class="layout">
    <div class="tree-col" id="treeRoot">
      <!-- 樹狀控制項將透過 JavaScript 動態渲染 -->
    </div>

    <div class="code-col" id="codePanel">
      <div class="code-title">
        <span>💻 程式碼切片檢視器</span>
        <button class="copy-btn" id="copyCodeBtn" style="display:none;" onclick="copyCode()">複製代碼</button>
      </div>
      <div id="inspectorContent" class="empty-state">
        👈 點擊左側任何函式節點或「代碼」按鈕，<br>即可即時預覽儲存於 NetworkX 的真實原始碼實作。
      </div>
    </div>
  </div>

hApi('/api/open-native-tab', {\n      method: 'POST',\n      body: { path: targetPath, fullPath: itemOrPath?.fullPath }\n    });\n\n    if (res && res.success) {\n      showToast(`📑 已在 Antigravity 主分頁開啟: ${fileName}`);\n    } else {\n      showToast(`開啟失敗: ${res?.error || '未知錯誤'}`);\n    }\n  } catch (err) {\n    showToast(`開啟失敗: ${err.message}`);\n  }\n}"}, "func:closePreview@sidecars/panel/app.js:L168C1": {"id": "func:closePreview@sidecars/panel/app.js:L168C1", "label": "closePreview", "signature": "function closePreview()", "parameters": "()", "line_start": 168, "line_end": 182, "line_count": 15, "is_async": false, "source_code": "function closePreview() {\n  const drawer = $('preview-drawer');\n  if (drawer) drawer.hidden = true;\n  if ($('preview-resizer')) $('preview-resizer').hidden = true;\n  if ($('annot-send-popover')) $('annot-send-popover').hidden = true;\n  if ($('selection-quote-bubble')) $('selection-quote-bubble').hidden = true;\n  if ($('delete-confirm-modal')) $('delete-confirm-modal').hidden = true;\n  if (window.previewManager) window.previewManager.destroy();\n  const body = $('preview-body');\n  if (body) body.innerHTML = '';\n  const customActions = $('preview-custom-actions');\n  if (customActions) customActions.innerHTML = '';\n  if ($('btn-send-agent')) $('btn-send-agent').hidden = false;\n  activePreviewFile = null;\n}"}, "func:confirmRecycleDelete@sidecars/panel/app.js:L184C1": {"id": "func:confirmRecycleDelete@sidecars/panel/app.js:L184C1", "label": "confirmRecycleDelete", "signature": "function confirmRecycleDelete(fileName, isDir)", "parameters": "(fileName, isDir)", "line_start": 184, "line_end": 241, "line_count": 58, "is_async": false, "source_code": "function confirmRecycleDelete(fileName, isDir) {\n  return new Promise((resolve) => {\n    const modal = $('delete-confirm-modal');\n    const targetEl = $('delete-confirm-target');\n    const btnConfirm = $('btn-delete-confirm');\n    const btnCancel = $('btn-delete-cancel');\n\n    if (!modal) {\n      resolve(true);\n      return;\n    }\n\n    const typeStr = isDir ? '資料夾' : '檔案';\n    if (targetEl) targetEl.textContent = `${typeStr}「${fileName}」`;\n\n    modal.hidden = false;\n\n    const cleanup = () => {\n      modal.hidden = true;\n      btnConfirm?.removeEventListener('click', onConfirm);\n      btnCancel?.removeEventListener('click', onCancel);\n      modal.removeEventListener('click', onOverlayClick);\n      window.removeEventListener('keydown', onKeyDown);\n    };\n\n    const onConfirm = () => {\n      cleanup();\n      resolve(true);\n    };\n\n    const onCancel = () => {\n      cleanup();\n      resolve(false);\n    };\n\n    const onOverlayClick = (e) => {\n      if (e.target === modal) {\n        onCancel();\n      }\n    };\n\n    const onKeyDown = (e) => {\n      if (e.key === 'Escape') {\n        e.preventDefault();\n        onCancel();\n      } else if (e.key === 'Enter') {\n        e.preventDefault();\n        onConfirm();\n      }\n    };\n\n    btnConfirm?.addEventListener('click', onConfirm);\n    btnCancel?.addEventListener('click', onCancel);\n    modal.addEventListener('click', onOverlayClick);\n    window.addEventListener('keydown', onKeyDown);\n    btnConfirm?.focus();\n  });\n}"}, "func:deleteItemToRecycleBin@sidecars/panel/app.js:L243C1": {"id": "func:deleteItemToRecycleBin@sidecars/panel/app.js:L243C1", "label": "deleteItemToRecycleBin", "signature": "async function deleteItemToRecycleBin(item, wrapper)", "parameters": "(item, wrapper)", "line_start": 243, "line_end": 275, "line_count": 33, "is_async": true, "source_code": "async function deleteItemToRecycleBin(item, wrapper) {\n  const isDir = Boolean(item.isDirectory);\n  const confirmed = await confirmRecycleDelete(item.name, isDir);\n  if (!confirmed) return;\n\n  try {\n    showToast(`正在將 ${item.name} 移至資源回收桶...`);\n    const res = await fetchApi('/api/delete-to-recycle-bin', {\n      method: 'POST',\n      body: { path: item.relPath, fullPath: item.fullPath     let currentSourceCode = "";

    function renderTree() {
      const root = document.getElementById('treeRoot');
      root.innerHTML = '';

      uiData.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'tree-item';
        itemEl.dataset.label = item.label.toLowerCase();

        const row = document.createElement('div');
        row.className = 'node-row';
        row.onclick = (e) => {
          if (e.target.tagName !== 'BUTTON') toggleCollapse(itemEl);
        };

        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = '▼';
        row.appendChild(arrow);

        const ctrlTag = document.createElement('span');
        ctrlTag.className = item.ui_type === 'Button' ? 'tag-btn' : 'tag-ctrl';
        ctrlTag.textContent = item.label;
        row.appendChild(ctrlTag);

        const typeTag = document.createElement('span');
        typeTag.className = 'tag-type';
        typeTag.textContent = item.ui_type + ' @ L' + item.line;
        row.appendChild(typeTag);

        if (item.bundle_count > 0) {
          const bundleBadge = document.createElement('span');
          bundleBadge.style.cssText = 'font-size: 11px; color: var(--accent); background: rgba(245,194,231,0.12); padding: 1px 6px; border-radius: 4px; border: 1px solid rgba(245,194,231,0.3);';
          bundleBadge.textContent = '📦 關聯 ' + item.bundle_count + ' 個函式';
          row.appendChild(bundleBadge);
        }

        itemEl.appendChild(row);

        const subTree = document.createElement('div');
        subTree.className = 'sub-tree';
        renderChildren(item.tree.children, subTree);
        itemEl.appendChild(subTree);

        root.appendChild(itemEl);
      });
    }

    function renderChildren(children, parentEl) {
      if (!children || children.length === 0) return;

      children.forEach(c => {
        const wrap = document.createElement('div');
        wrap.className = 'tree-item';

        const row = document.createElement('div');
        row.className = 'node-row';

        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = (c.children && c.children.length > 0) ? '▼' : '';
        row.appendChild(arrow);

        if (c.children && c.children.length > 0) {
          row.onclick = (e) => {
            if (e.target.tagName !== 'BUTTON') toggleCollapse(wrap);
          };
        }

        if (c.is_await) {
          const awaitTag = document.createElement('span');
          awaitTag.className = 'tag-await';
          awaitTag.textContent = '⏳ await';
          row.appendChild(awaitTag);
        }

        const nameTag = document.createElement('span');
        if (c.category === 'EVENT_BINDING') {
          nameTag.className = 'tag-event';
          nameTag.textContent = '⚡ ' + c.label;
        } else if (c.category === 'FUNCTION_DEF') {
          nameTag.className = 'tag-func';
          nameTag.textContent = '🔒 ' + c.label + '()';
        } else {
          nameTag.textContent = c.label;
        }
        row.appendChild(nameTag);

        if (c.has_code) {
          const inspectBtn = document.createElement('button');
          inspectBtn.className = 'btn-inspect';
          inspectBtn.textContent = '代碼 💻';
          inspectBtn.onclick = (e) => {
            e.stopPropagation();
            inspectFunction(c.id, row);
          };
          row.appendChild(inspectBtn);
        }

        wrap.appendChild(row);

        if (c.children && c.children.length > 0) {
          const sub = document.createElement('div');
          sub.className = 'sub-tree';
          renderChildren(c.children, sub);
          wrap.appendChild(sub);
        }

        parentEl.appendChild(wrap);
      });
    }

    function toggleCollapse(el) {
      el.classList.toggle('collapsed');
    }

    function inspectFunction(funcId, rowEl) {
      document.querySelectorAll('.node-row').forEach(r => r.classList.remove('active'));
      if (rowEl) rowEl.classList.add('active');

      const meta = funcsData[funcId];
      if (!meta) return;

      currentSourceCode = meta.source_code;
      document.getElementById('copyCodeBtn').style.display = 'block';

      const panel = document.getElementById('inspectorContent');
      panel.innerHTML = `
        <div class="code-meta">
          <div><strong>簽章:</strong> <span style="color:var(--primary)">${escapeHtml(meta.signature)}</span></div>
          <div><strong>範圍:</strong> L${meta.line_start} ~ L${meta.line_end} (共 ${meta.line_count} 行)</div>
          <div><strong>非同步:</strong> ${meta.is_async ? '⚡ async function' : '一般同步函式'}</div>
          <div><strong>參數:</strong> ${escapeHtml(meta.parameters)}</div>
        </div>
        <div class="code-box">${escapeHtml(meta.source_code)}</div>
      `;
    }

    function copyCode() {
      if (currentSourceCode) {
        navigator.clipboard.writeText(currentSourceCode);
        const btn = document.getElementById('copyCodeBtn');
        const orig = btn.textContent;
        btn.textContent = '✅ 已複製！';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function filterTree() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      document.querySelectorAll('#treeRoot > .tree-item').forEach(el => {
        const text = el.textContent.toLowerCase();
        if (!query || text.includes(query)) {
          el.style.display = 'block';
        } else {
          el.style.display = 'none';
        }
      });
    }

    renderTree();
  </script>
