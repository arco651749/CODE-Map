)\n    return", "scope_id": "scope:global", "class_name": ""}, "func:clean_text_data@D:\\AntiGravity\\Agent-Study\\antigravity-marimo\\toolbox\\agent_toolbox.py:L45": {"id": "func:clean_text_data@D:\\AntiGravity\\Agent-Study\\antigravity-marimo\\toolbox\\agent_toolbox.py:L45", "label": "clean_text_data", "raw_label": "clean_text_data", "signature": "def clean_text_data(raw_text", "parameters": "(raw_text: str, remove_blank: bool = True, strip_lines: bool = True)", "line_start": 45, "line_end": 59, "line_count": 15, "is_async": false, "source_code": "def clean_text_data(raw_text: str, remove_blank: bool = True, strip_lines: bool = True) -> dict:\n    \"\"\"核心邏輯：純 Python 函式，可直接被外部 import 或匯出。\"\"\"\n    lines = raw_text.splitlines()\n    cleaned = []\n    for line in lines:\n        target = line.strip() if strip_lines else line\n        if remove_blank and not target:\n            continue\n        cleaned.append(target)\n    return {\n        \"total_lines\": len(cleaned),\n        \"original_lines\": len(lines),\n        \"char_count\": sum(len(line) for line in cleaned),\n        \"preview\": cleaned[:10]\n    }", "scope_id": "scope:global", "class_name": ""}, "func:_@D:\\AntiGravity\\Agent-Study\\antigravity-marimo\\toolbox\\agent_toolbox.py:L63": {"id": "func:_@D:\\AntiGravity\\Agent-Study\\antigravity-marimo\\toolbox\\agent_toolbox.py:L63", "label": "Cell (L63)", "raw_label": "_", "signature": "def _(mo)", "parameters": "(mo)", "line_start": 63, "line_end": 91, "line_count": 29, "is_async": false, "source_code": "def _(mo):\n    # 互動式操作元件\n    sample_text = (\n        \"Antigravity Marimo Extension\\n\"\n        \"支援雙向即時熱重載與側邊欄操作\\n\"\n        \"\\n\"\n        \"測試行 1：處理特殊字元與 Emoji 🚀 ✨\\n\"\n        \"測試行 2：Windows 環境自動適配\\n\"\n        \"   \\n\"\n        \"結束測試行\"\n    )\n    txt_input = mo.ui.text_area(value=sample_text, label=\"輸入待處理文字\", rows=6)\n    chk_blank = mo.ui.checkbox(value=True, label=\"過濾空白行\")\n    chk_strip = mo.ui.checkbox(value=True, label=\" dswith(\"```\"):\n        text = text[:-3]\n    text = text.strip()\n\n    try:\n        parsed = json.loads(text)\n        return {\"valid\": True, \"type\": type(parsed).__name__, \"data\": parsed}\n    except Exception as e:\n        return {\"valid\": False, \"error\": str(e), \"data\": None}", "scope_id": "scope:global", "class_name": ""}, "func:_@D:\\AntiGravity\\Agent-Study\\antigravity-marimo\\toolbox\\agent_toolbox.py:L129": {"id": "func:_@D:\\AntiGravity\\Agent-Study\\antigravity-marimo\\toolbox\\agent_toolbox.py:L129", "label": "Cell (L129)", "raw_label": "_", "signature": "def _(mo)", "parameters": "(mo)", "line_start": 129, "line_end": 142, "line_count": 14, "is_async": false, "source_code": "def _(mo):\n    sample_json = '{\\n  \"status\": \"success\",\\n  \"model\": \"gemini-3.8-flash\",\\n  \"tools_count\": 5\\n}'\n    json_area = mo.ui.text_area(value=sample_json, label=\"輸入 JSON 字串 (支援包含 ``` 標籤)\", rows=5)\n    parse_btn = mo.ui.run_button(label=\"🔍 驗證與解析\")\n\n    json_result = safe_parse_json(json_area.value) if (parse_btn.value or json_area.value) else None\n\n    mo.vstack([\n        mo.md(\"### 🎛️ 模組 2 自助操作面板\"),\n        json_area,\n        parse_btn,\n        mo.ui.json(json_result) if json_result else mo.md(\"_請輸入 JSON 並點擊驗證_\")\n    ])\n    return", "scope_id": "scope:global", "class_name": ""}, "func:App@external": {"id": "func:App@external", "label": "App (External/Unresolved)", "raw_label": "App (External/Unresolved)", "signature": "App (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}, "func:md@external": {"id": "func:md@external", "label": "md (External/Unresolved)", "raw_label": "md (External/Unresolved)", "signature": "md (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}, "func:splitlines@external": {"id": "func:splitlines@external", "label": "splitlines (External/Unresolved)", "raw_label": "splitlines (External/Unresolved)", "signature": "splitlines (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}, "func:sum@external": {"id": "func:sum@external", "label": "sum (External/Unresolved)", "raw_label": "sum (External/Unresolved)", "signature": "sum (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}, "func:text_area@external": {"id": "func:text_area@external", "label": "text_area (External/Unresolved)", "raw_label": "text_area (External/Unresolved)", "signature": "text_area (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}, "func:checkbox@external": {"id": "func:checkbox@external", "label": "checkbox (External/Unresolved)", "raw_label": "checkbox (External/Unresolved)", "signature": "checkbox (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}, "func:run_button@external": {"id": "func:run_button@external", "label": "run_button (External/Unresolved)", "raw_label": "run_button (External/Unresolved)", "signature": "run_button (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}, "func:vstack@external": {"id": "func:vstack@external", "label": "vstack (External/Unresolved)", "raw_label": "vstack (External/Unresolved)", "signature": "vstack (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}, "func:hstack@external": {"id": "func:hstack@external", "label": "hstack (External/Unresolved)", "raw_label": "hstack (External/Unresolved)", "signature": "hstack (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}, "func:json@external": {"id": "func:json@external", "label": "json (External/Unresolved)", "raw_label": "json (External/Unresolved)", "signature": "json (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}, "func:loads@external": {"id": "func:loads@external", "label": "loads (External/Unresolved)", "raw_label": "loads (External/Unresolved)", "signature": "loads (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}, "func:type@external": {"id": "func:type@external", "label": "type (External/Unresolved)", "raw_label": "type (External/Unresolved)", "signature": "type (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}, "func:run@external": {"id": "func:run@external", "label": "run (External/Unresolved)", "raw_label": "run (External/Unresolved)", "signature": "run (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}};

    let currentSourceCode = "";

    function renderTree() {
      const root = document.getElementById('treeRoot');
      root.innerHTML = '';

      uiData.forEach((item, idx) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'tree-item';
        itemEl.dataset.label = item.label.toLowerCase();
        itemEl.id = 'anchor-' + idx;

        const row = document.createElement('div');
        row.className = 'node-row';
        row.id = 'row-anchor-' + idx;

        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = (item.tree.children && item.tree.children.length > 0) ? '▼' : '';
        row.appendChild(arrow);

        const ctrlTag = document.createElement('span');
        ctrlTag.className = (item.ui_type === 'Button' || item.ui_type === 'CLI Entry') ? 'tag-btn' : 'tag-ctrl';
        ctrlTag.textContent = item.label;
        row.appendChild(ctrlTag);

        const typeTag = document.createElement('span');
        typeTag.className = 'tag-type';
        typeTag.textContent = item.ui_type + ' @ L' + item.line;
        row.appendChild(typeTag);

        // 整包因果代碼 (Bundle) 按鈕
        if (item.bundle_count > 0) {
          const bundleBtn = document.createElement('button');
          bundleBtn.className = 'btn-bundle-code';
          bundleBtn.textContent = '📦 關聯 ' + item.bundle_count + ' 函式代碼包';
          bundleBtn.title = '查看該錨點觸發的所有函式原始碼集合';
          bundleBtn.onclick = (e) => {
            e.stopPropagation();
            showBundle(item, row);
          };
          row.appendChild(bundleBtn);
        }

        // 若錨點本身就是函式且具備源碼，渲染查看按鈕
        if (funcsData[item.anchor_id]) {
          const inspectBtn = document.createElement('button');
          inspectBtn.className = 'btn-action-code';
          inspectBtn.innerHTML = '💻 查看原始碼';
          inspectBtn.onclick = (e) => {
            e.stopPropagation();
            inspectFunction(item.anchor_id, row);
          };
          row.appendChild(inspectBtn);
        }

        row.onclick = (e) => {
          if (e.target.tagName !== 'BUTTON') {
            toggleCollapse(itemEl);
            if (item.bundle_count > 0) showBundle(item, row);
            else if (funcsData[item.anchor_id]) inspectFunction(item.anchor_id, row);
          }
        };

        itemEl.appendChild(row);

        const subTree = document.createElement('div');
        subTree.className = 'sub-tree';
        renderChildren(item.tree.children, subTree);
        itemEl.appendChild(subTree);

        root.appendChild(itemEl);
      });
    }

    function renderChildren(children, parentEl) {
      if (!children || children.length === 0) return;

      children.forEach(c => {
        const wrap = document.createElement('div');
        wrap.className = 'tree-item';

        const row = document.createElement('div');
        row.className = 'node-row';

        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = (c.children && c.children.length > 0) ? '▼' : '';
        row.appendChild(arrow);

        if (c.children && c.children.length > 0) {
          row.onclick = (e) => {
            if (e.target.tagName !== 'BUTTON') toggleCollapse(wrap);
          };
        }

        if (c.is_await) {
          const awaitTag = document.createElement('span');
          awaitTag.className = 'tag-await';
          awaitTag.textContent = '⏳ await';
          row.appendChild(awaitTag);
        }

        if (c.edge_status === 'BLOCKED_SCOPE') {
          const blockedTag = document.createElement('span');
          blockedTag.className = 'tag-blocked';
          blockedTag.textContent = '💥 BLOCKED';
          row.appendChild(blockedTag);
        }

        const nameTag = document.createElement('span');
        if (c.category === 'EVENT_BINDING') {
          nameTag.className = 'tag-event';
          nameTag.textContent = '⚡ ' + c.label;
        } else if (c.category === 'FUNCTION_DEF') {
          nameTag.className = 'tag-func';
          nameTag.textContent = '🔒 ' + c.label + '()';
          row.onclick = (e) => {
            if (e.target.tagName !== 'BUTTON') {
              if (c.has_code) inspectFunction(c.id, row);
              if (c.children && c.children.length > 0) toggleCollapse(wrap);
            }
          };
        } else {
          nameTag.textContent = c.label;
        }
        row.appendChild(nameTag);

        // 如果是函式節點且具備代碼，渲染查看原始碼按鈕
        if (c.has_code) {
          const inspectBtn = document.createElement('button');
          inspectBtn.className = 'btn-action-code';
          inspectBtn.innerHTML = '💻 查看原始碼';
          inspectBtn.onclick = (e) => {
            e.stopPropagation();
            inspectFunction(c.id, row);
          };
          row.appendChild(inspectBtn);
        }

        wrap.appendChild(row);

        if (c.children && c.children.length > 0) {
          const sub = document.createElement('div');
          sub.className = 'sub-tree';
          renderChildren(c.children, sub);
          wrap.appendChild(sub);
        }

        parentEl.appendChild(wrap);
      });
    }

    function toggleCollapse(el) {
      el.classList.toggle('collapsed');
    }

    function inspectFunction(funcId, rowEl) {
      document.querySelectorAll('.node-row').forEach(r => r.classList.remove('active'));
      if (rowEl) rowEl.classList.add('active');

      const meta = funcsData[funcId];
      if (!meta) return;

      currentSourceCode = meta.source_code;
      document.getElementById('panelTitle').textContent = '💻 函式實作: ' + meta.label + '()';
      document.getElementById('copyCodeBtn').style.display = 'block';

      const panel = document.getElementById('inspectorContent');
      panel.innerHTML = `
        <div class="code-meta">
          <div><strong>函式簽章:</strong> <span style="color:var(--primary)">${escapeHtml(meta.signature)}</span></div>
          <div><strong>精確範圍:</strong> L${meta.line_start} ~ L${meta.line_end} (共 ${meta.line_count} 行)</div>
          <div><strong>執行型別:</strong> ${meta.is_async ? '⚡ async function (非同步 Promise)' : '同步一般函式'}</div>
          <div><strong>作用空間:</strong> ${escapeHtml(meta.scope_id)}</div>
        </div>
        <div class="code-box">${escapeHtml(meta.source_code)}</div>
      `;
    }

    function showBundle(item, rowEl) {
      document.querySelectorAll('.node-row').forEach(r => r.classList.remove('active'));
      if (rowEl) rowEl.classList.add('active');

      currentSourceCode = item.bundle_text;
      document.getElementById('panelTitle').textContent = '📦 ' + item.label + ' 因果代碼包 (共 ' + item.bundle_count + ' 函式)';
      document.getElementById('copyCodeBtn').style.display = 'block';

      const panel = document.getElementById('inspectorContent');
      panel.innerHTML = `
        <div class="code-meta">
          <div><strong>錨點/入口:</strong> <span style="color:var(--primary)">${escapeHtml(item.label)} (${escapeHtml(item.ui_type)})</span></div>
          <div><strong>關聯函式:</strong> 共 ${item.bundle_count} 個呼叫實作函式已由 NetworkX 打包</div>
        </div>
        <div class="code-box">${escapeHtml(item.bundle_text)}</div>
      `;
    }

    function copyCode() {
      if (currentSourceCode) {
        navigator.clipboard.writeText(currentSourceCode);
        const btn = document.getElementById('copyCodeBtn');
        const orig = btn.textContent;
        btn.textContent = '✅ 已複製！';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function filterTree() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      document.querySelectorAll('#treeRoot > .tree-item').forEach(el => {
        const text = el.textContent.toLowerCase();
        if (!query || text.includes(query)) {
          el.style.display = 'block';
        } else {
          el.style.display = 'none';
        }
      });
    }

    // 初始化渲染
    renderTree();

    // 預設高亮第一個錨點或優先選擇核心函式
    if (uiData.length > 0) {
      let defaultIdx = 0;
      const targetIdx = uiData.findIndex(d => d.label.includes('Delete') || d.label.includes('main') || d.label.includes('clean_text') || d.label.includes('safe_parse'));
      if (targetIdx !== -1) defaultIdx = targetIdx;

      const targetItem = uiData[defaultIdx];
      const targetRow = document.getElementById('row-anchor-' + defaultIdx);
      if (targetItem.bundle_count > 0) {
        showBundle(targetItem, targetRow);
      } else if (funcsData[targetItem.anchor_id]) {
        inspectFunction(targetItem.anchor_id, targetRow);
      }
    }
  </script>
