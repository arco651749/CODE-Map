n      showToast(`📑 已在 Antigravity 主分頁開啟: ${fileName}`);\n    } else {\n      showToast(`開啟失敗: ${res?.error || '未知錯誤'}`);\n    }\n  } catch (err) {\n    showToast(`開啟失敗: ${err.message}`);\n  }\n}", "scope_id": "scope:global", "class_name": ""}, "func:closePreview@D:\\Users\\arco0\\.gemini\\config\\plugins\\workspace-file-tree\\sidecars\\panel\\app.js:L168C1": {"id": "func:closePreview@D:\\Users\\arco0\\.gemini\\config\\plugins\\workspace-file-tree\\sidecars\\panel\\app.js:L168C1", "label": "closePreview", "raw_label": "closePreview", "signature": "function closePreview()", "parameters": "()", "line_start": 168, "line_end": 182, "line_count": 15, "is_async": false, "source_code": "function closePreview() {\n  const drawer = $('preview-drawer');\n  if (drawer) drawer.hidden = true;\n  if ($('preview-resizer')) $('preview-resizer').hidden = true;\n  if ($('annot-send-popover')) $('annot-send-popover').hidden = true;\n  if ($('selection-quote-bubble')) $('selection-quote-bubble').hidden = true;\n  if ($('delete-confirm-modal')) $('delete-confirm-modal').hidden = true;\n  if (window.previewManager) window.previewManager.destroy();\n  const body = $('preview-body');\n  if (body) body.innerHTML = '';\n  const customActions = $('preview-custom-actions');\n  if (customActions) customActions.innerHTML = '';\n  if ($('btn-send-agent')) $('btn-send-agent').hidden = false;\n  activePreviewFile = null;\n}", "scope_id": "scope:global", "class_name": ""}, "func:confirmRecycleDelete@D:\\Users\\arco0\\.gemini\\config\\plugins\\workspace-file-tree\\sidecars\\panel\\app.js:L184C1": {"id": "func:confirmRecycleDelete@D:\\Users\\arco0\\.gemini\\config\\plugins\\workspace-file-tree\\sidecars\\panel\\app.js:L184C1", "label": "confirmRecycleDelete", "raw_label": "confirmRecycleDelete", "signature": "function confirmRecycleDelete(fileName, isDir)", "parameters": "(fileName, isDir)", "line_start": 184, "line_end": 241, "line_count": 58, "is_async": false, "source_code": "function confirmRecycleDelete(fileName, isDir) {\n  return new Promise((resolve) => {\n    const modal = $('delete-confirm-modal');\n    const targetEl = $('delete-confirm-target');\n    const btnConfirm = $('btn-delete-confirm');\n    const btnCancel = $('btn-delete-cancel');\n\n    if (!modal) {\n      resolve(true);\n      return;\n    }\n\n    const typeStr = isDir ? '資料夾' : '檔案';\n    if (targetEl) targetEl.textContent = `${typeStr}「${fileName}」`;\n\n    modal.hidden = false;\n\n    const cleanup = () => {\n      modal.hidden = true;\n      btnConfirm?.removeEventListener('click', onConfirm);\n      btnCancel?.removeEventListener('click', onCancel);\n      modal.removeEventListener('click', onOverlayClick);\n      window.removeEventListener('keydown', onKeyDown);\n    };\n\n    const onConfirm = () => {\n      cleanup();\n      resolve(true);\n    };\n\n    const onCancel = () => {\n      cleanup();\n      resolve(false);\n    };\n\n    const onOverlayClick = (e) => {\n      if (e.target === modal) {\n        onCancel();\n      }\n    };\n\n    const onKeyDown = (e) => {\n      if (e.key === 'Escape') {\n        e.preventDefault();\n        onCancel();\n      } else if (e.key === 'Enter') {\n        e.preventDefault();\n        onConfirm();\n      }\n    };\n\n    btnConfirm?.addEventListener('click', onConfirm);\n    btnCancel?.addEventListener('click', onCancel);\n    modal.addEventListener('click', onOverlayClick);\n    window.addEventListener('keydown', onKeyDown);\n    btnConfirm?.focus();\n  });\n}", "scope_id": "scope:global", "class_name": ""}, "func:deleteItemToRecycleBin@D:\\Users\\arco0\\.gemini\\config\\plugins\\workspace-file-tree\\sidecars\\panel\\app.js:L243C1": {"id": "func:deleteItemToRecycleBin@D:\\Users\\arco0\\.gemini\\config\\plugins\\workspace-file-tree\\sidecars\\panel\\app.js:L243C1", "label": "deleteItemToRecycleBin", "raw_label": "deleteItemToRecycleBin", "signature": "async function deleteItemToRecycleBin(item, wrapper)", "parameters": "(item, wrapper)", "line_start": 243, "line_end": 275, "line_count": 33, "is_async": true, "source_code": "async function deleteItemToRecycleBin(item, wrapper) {\n  const isDir = Boolean(item.isDirectory);\n  const confirmed = await confirmRecycleDelete(item.name, isDir);\n  if (!confirmed) return;\n\n  try {\n    showToast(`正在將 ${item.name} 移至資源回收桶...`);\n    const res = await fetchApi('/api/delete-to-recycle-bin', {\n      method: 'POST',\n      body: { path: item.relPath, fullPath: item.fullPath }\n    });\n\n    if (res && (res.success || res.ok)) {\n      showToast(`🗑️ 已將 ${item.name} 移至資源回收桶`);\n      if (activePreviewFile === item.relPath) {\n        closePreview();\n      }\n      selectedItems.delete(item.relPath);\n      if (wrapper) {\n        wrapper.style.transition = 'opacity 0.2s ease, transform 0.2s ease';\n        wrapper.style.opacity = '0';\n        wrapper.style.transform = 'translateX(-10px)';\n        setTimeout(() => {\n          wrapper.remove();\n        }, 200);\n      }\n    } else {\n      showToast(`刪除失敗: ${res?.error || '未知錯誤'}`);\n    }\n  } catch (err) {\n    showToast(`刪除失敗: ${err.message}`);\n  }\n}", "scope_id": "scope:global", "class_name": ""}, "func:createTreeNode@D:\\Users\\arco0\\.gemini\\config\\plugins\\workspace-file-tree\\sidecars\\panel\\app.js:L280C1": {"id": "func:createTreeNode@D:\\Users\\arco0\\.gemini\\config\\plugins\\workspace-file-tree\\sidecars\\panel\\app.js:L280C1", "label": "createTreeNode", "raw_label": "createTreeNode", "signature": "function createTreeNode(item, level = 0)", "parameters": "(item, level = 0)", "line_start": 280, "line_end": 509, "line_count": 230, "is_async": false, "source_code": "function createTreeNode(item, level = 0) {\n  const wrapper = document.createElement('div');\n  wrapper.className = 'tree-node-wrapper';\n  wrapper.dataset.path = item.relPath;\n  wrapper.dataset.name = item.name.toLowerCase();\n\n  const row = document.createElement('div');\n  row.className = 'tree-node-row';\n  row.style.paddingLeft = `${level * 16 + 8}px`;\n  row.__item = item;\n  row.setAttribute('draggable', 'true');\n\n  if (selectedItems.has(item.relPath)) {\n    row.classList.add('selected');\n    selectedItems.set(item.relPath, { item, row });\n  }\n\n  const expander = document.createElement('span');\n  expander.className = 'tree-expander';\n  expander.textContent = item.isDirectory ? '▶' : '';\n\n  const icon = document.createElement('span');\n  icon.className = 'tree-icon';\n  icon.textContent = getFileIcon(item.ext, item.isDirectory, false);\n\n  const label = document.createElement('span');\n  label.className = 'tree-label';\n  label.textContent = item.name;\n\n  row.appendChild(expander);\n  row.appendChild(icon);\n  row.appendChild(label);\n\n  // Actions on hover\n  if (!item.isDirectory) {\n    const actions = document.createElement('div');\n    actions.className = 'tree-actions';\n\n    const btnOpenTab = document.createElement('button');\n    btnOpenTab.innerHTML = '↗️';\n    btnOpenTab.title = '在 Antigravity 主分頁開啟 (Open in Native Tab)';\n    btnOpenTab.addEventListener('click', (e) => {\n      e.stopPropagation();\n      openFileInNativeTab(item);\n    });\n\n    const btnChat = document.createElement('button');\n    btnChat.innerHTML = '💬';\n    btnChat.title = 'Ask Agent about this file';\n    btnChat.addEventListener('click', (e) => {\n      e.stopPropagation();\n      sendFilePathToAgent(item.relPath);\n    });\n\n    const btnView = document.createElement('button');\n    btnView.innerHTML = '👁️';\n    btnView.title = 'Preview Content';\n    btnView.addEventListener('click', (e) => {\n      e.stopPropagation();\n      openPreview(item.relPath);\n    });\n\n    const btnDelete = document.createElement('button');\n    btnDelete.className = 'btn-delete';\n    btnDelete.innerHTML = '🗑️';\n    btnDelete.title = '移至資源回收桶 (Move to Recycle Bin)';\n    btnDelete.addEventListener('click', async (e) => {\n      e.stopPropagation();\n      await deleteItemToRecycleBin(item, wrapper   }\n  });\n\n  $('tree-viewport').addEventListener('click', (e) => {\n    if (e.target === $('tree-viewport') || e.target === $('tree-container')) {\n      clearSelection();\n    }\n  });\n\n  initResizer();\n  setupTextSelectionQuote();\n  loadRootTree();\n}", "scope_id": "scope:global", "class_name": ""}, "func:initResizer@D:\\Users\\arco0\\.gemini\\config\\plugins\\workspace-file-tree\\sidecars\\panel\\app.js:L932C3": {"id": "func:initResizer@D:\\Users\\arco0\\.gemini\\config\\plugins\\workspace-file-tree\\sidecars\\panel\\app.js:L932C3", "label": "initResizer", "raw_label": "initResizer", "signature": "function initResizer()", "parameters": "()", "line_start": 932, "line_end": 967, "line_count": 36, "is_async": false, "source_code": "function initResizer() {\n    const resizer = $('preview-resizer');\n    const drawer = $('preview-drawer');\n    if (!resizer || !drawer) return;\n\n    let isResizing = false;\n    let startY = 0;\n    let startHeight = 0;\n\n    resizer.addEventListener('mousedown', (e) => {\n      isResizing = true;\n      startY = e.clientY;\n      startHeight = drawer.offsetHeight;\n      resizer.classList.add('resizing');\n      document.body.style.userSelect = 'none';\n      document.body.style.cursor = 'row-resize';\n    });\n\n    window.addEventListener('mousemove', (e) => {\n      if (!isResizing) return;\n      const dy = startY - e.clientY;\n      const minH = 100;\n      const maxH = window.innerHeight * 0.85;\n      const newHeight = Math.max(minH, Math.min(maxH, startHeight + dy));\n      drawer.style.height = `${newHeight}px`;\n    });\n\n    window.addEventListener('mouseup', () => {\n      if (isResizing) {\n        isResizing = false;\n        resizer.classList.remove('resizing');\n        document.body.style.userSelect = '';\n        document.body.style.cursor = '';\n      }\n    });\n  }", "scope_id": "scope:init@D:\\Users\\arco0\\.gemini\\config\\plugins\\workspace-file-tree\\sidecars\\panel\\app.js:L863C1", "class_name": "" urce_code": "", "scope_id": "external", "class_name": ""}, "func:onOverlayClick@external": {"id": "func:onOverlayClick@external", "label": "onOverlayClick (External/Unresolved)", "raw_label": "onOverlayClick (External/Unresolved)", "signature": "onOverlayClick (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}, "func:onKeyDown@external": {"id": "func:onKeyDown@external", "label": "onKeyDown (External/Unresolved)", "raw_label": "onKeyDown (External/Unresolved)", "signature": "onKeyDown (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}, "func:Boolean@external": {"id": "func:Boolean@external", "label": "Boolean (External/Unresolved)", "raw_label": "Boolean (External/Unresolved)", "signature": "Boolean (External/Unresolved)", "parameters": "()", "line_start": 0, "line_end": 0, "line_count": 1, "is_async": false, "source_code": "", "scope_id": "external", "class_name": ""}};

    let currentSourceCode = "";

    function renderTree() {
      const root = document.getElementById('treeRoot');
      root.innerHTML = '';

      uiData.forEach((item, idx) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'tree-item';
        itemEl.dataset.label = item.label.toLowerCase();
        itemEl.id = 'anchor-' + idx;

        const row = document.createElement('div');
        row.className = 'node-row';
        row.id = 'row-anchor-' + idx;

        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = (item.tree.children && item.tree.children.length > 0) ? '▼' : '';
        row.appendChild(arrow);

        const ctrlTag = document.createElement('span');
        ctrlTag.className = (item.ui_type === 'Button' || item.ui_type === 'CLI Entry') ? 'tag-btn' : 'tag-ctrl';
        ctrlTag.textContent = item.label;
        row.appendChild(ctrlTag);

        const typeTag = document.createElement('span');
        typeTag.className = 'tag-type';
        typeTag.textContent = item.ui_type + ' @ L' + item.line;
        row.appendChild(typeTag);

        // 整包因果代碼 (Bundle) 按鈕
        if (item.bundle_count > 0) {
          const bundleBtn = document.createElement('button');
          bundleBtn.className = 'btn-bundle-code';
          bundleBtn.textContent = '📦 關聯 ' + item.bundle_count + ' 函式代碼包';
          bundleBtn.title = '查看該錨點觸發的所有函式原始碼集合';
          bundleBtn.onclick = (e) => {
            e.stopPropagation();
            showBundle(item, row);
          };
          row.appendChild(bundleBtn);
        }

        // 若錨點本身就是函式且具備源碼，渲染查看按鈕
        if (funcsData[item.anchor_id]) {
          const inspectBtn = document.createElement('button');
          inspectBtn.className = 'btn-action-code';
          inspectBtn.innerHTML = '💻 查看原始碼';
          inspectBtn.onclick = (e) => {
            e.stopPropagation();
            inspectFunction(item.anchor_id, row);
          };
          row.appendChild(inspectBtn);
        }

        row.onclick = (e) => {
          if (e.target.tagName !== 'BUTTON') {
            toggleCollapse(itemEl);
            if (item.bundle_count > 0) showBundle(item, row);
            else if (funcsData[item.anchor_id]) inspectFunction(item.anchor_id, row);
          }
        };

        itemEl.appendChild(row);

        const subTree = document.createElement('div');
        subTree.className = 'sub-tree';
        renderChildren(item.tree.children, subTree);
        itemEl.appendChild(subTree);

        root.appendChild(itemEl);
      });
    }

    function renderChildren(children, parentEl) {
      if (!children || children.length === 0) return;

      children.forEach(c => {
        const wrap = document.createElement('div');
        wrap.className = 'tree-item';

        const row = document.createElement('div');
        row.className = 'node-row';

        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = (c.children && c.children.length > 0) ? '▼' : '';
        row.appendChild(arrow);

        if (c.children && c.children.length > 0) {
          row.onclick = (e) => {
            if (e.target.tagName !== 'BUTTON') toggleCollapse(wrap);
          };
        }

        if (c.is_await) {
          const awaitTag = document.createElement('span');
          awaitTag.className = 'tag-await';
          awaitTag.textContent = '⏳ await';
          row.appendChild(awaitTag);
        }

        if (c.edge_status === 'BLOCKED_SCOPE') {
          const blockedTag = document.createElement('span');
          blockedTag.className = 'tag-blocked';
          blockedTag.textContent = '💥 BLOCKED';
          row.appendChild(blockedTag);
        }

        const nameTag = document.createElement('span');
        if (c.category === 'EVENT_BINDING') {
          nameTag.className = 'tag-event';
          nameTag.textContent = '⚡ ' + c.label;
        } else if (c.category === 'FUNCTION_DEF') {
          nameTag.className = 'tag-func';
          nameTag.textContent = '🔒 ' + c.label + '()';
          row.onclick = (e) => {
            if (e.target.tagName !== 'BUTTON') {
              if (c.has_code) inspectFunction(c.id, row);
              if (c.children && c.children.length > 0) toggleCollapse(wrap);
            }
          };
        } else {
          nameTag.textContent = c.label;
        }
        row.appendChild(nameTag);

        // 如果是函式節點且具備代碼，渲染查看原始碼按鈕
        if (c.has_code) {
          const inspectBtn = document.createElement('button');
          inspectBtn.className = 'btn-action-code';
          inspectBtn.innerHTML = '💻 查看原始碼';
          inspectBtn.onclick = (e) => {
            e.stopPropagation();
            inspectFunction(c.id, row);
          };
          row.appendChild(inspectBtn);
        }

        wrap.appendChild(row);

        if (c.children && c.children.length > 0) {
          const sub = document.createElement('div');
          sub.className = 'sub-tree';
          renderChildren(c.children, sub);
          wrap.appendChild(sub);
        }

        parentEl.appendChild(wrap);
      });
    }

    function toggleCollapse(el) {
      el.classList.toggle('collapsed');
    }

    function inspectFunction(funcId, rowEl) {
      document.querySelectorAll('.node-row').forEach(r => r.classList.remove('active'));
      if (rowEl) rowEl.classList.add('active');

      const meta = funcsData[funcId];
      if (!meta) return;

      currentSourceCode = meta.source_code;
      document.getElementById('panelTitle').textContent = '💻 函式實作: ' + meta.label + '()';
      document.getElementById('copyCodeBtn').style.display = 'block';

      const panel = document.getElementById('inspectorContent');
      panel.innerHTML = `
        <div class="code-meta">
          <div><strong>函式簽章:</strong> <span style="color:var(--primary)">${escapeHtml(meta.signature)}</span></div>
          <div><strong>精確範圍:</strong> L${meta.line_start} ~ L${meta.line_end} (共 ${meta.line_count} 行)</div>
          <div><strong>執行型別:</strong> ${meta.is_async ? '⚡ async function (非同步 Promise)' : '同步一般函式'}</div>
          <div><strong>作用空間:</strong> ${escapeHtml(meta.scope_id)}</div>
        </div>
        <div class="code-box">${escapeHtml(meta.source_code)}</div>
      `;
    }

    function showBundle(item, rowEl) {
      document.querySelectorAll('.node-row').forEach(r => r.classList.remove('active'));
      if (rowEl) rowEl.classList.add('active');

      currentSourceCode = item.bundle_text;
      document.getElementById('panelTitle').textContent = '📦 ' + item.label + ' 因果代碼包 (共 ' + item.bundle_count + ' 函式)';
      document.getElementById('copyCodeBtn').style.display = 'block';

      const panel = document.getElementById('inspectorContent');
      panel.innerHTML = `
        <div class="code-meta">
          <div><strong>錨點/入口:</strong> <span style="color:var(--primary)">${escapeHtml(item.label)} (${escapeHtml(item.ui_type)})</span></div>
          <div><strong>關聯函式:</strong> 共 ${item.bundle_count} 個呼叫實作函式已由 NetworkX 打包</div>
        </div>
        <div class="code-box">${escapeHtml(item.bundle_text)}</div>
      `;
    }

    function copyCode() {
      if (currentSourceCode) {
        navigator.clipboard.writeText(currentSourceCode);
        const btn = document.getElementById('copyCodeBtn');
        const orig = btn.textContent;
        btn.textContent = '✅ 已複製！';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function filterTree() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      document.querySelectorAll('#treeRoot > .tree-item').forEach(el => {
        const text = el.textContent.toLowerCase();
        if (!query || text.includes(query)) {
          el.style.display = 'block';
        } else {
          el.style.display = 'none';
        }
      });
    }

    // 初始化渲染
    renderTree();

    // 預設高亮第一個錨點或優先選擇核心函式
    if (uiData.length > 0) {
      let defaultIdx = 0;
      const targetIdx = uiData.findIndex(d => d.label.includes('Delete') || d.label.includes('main') || d.label.includes('clean_text') || d.label.includes('safe_parse'));
      if (targetIdx !== -1) defaultIdx = targetIdx;

      const targetItem = uiData[defaultIdx];
      const targetRow = document.getElementById('row-anchor-' + defaultIdx);
      if (targetItem.bundle_count > 0) {
        showBundle(targetItem, targetRow);
      } else if (funcsData[targetItem.anchor_id]) {
        inspectFunction(targetItem.anchor_id, targetRow);
      }
    }
  </script>
